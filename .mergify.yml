# Mergify config — Dependabot batching for cueapi-mcp.
#
# Regular PRs are auto-merged via the maintainer when CI is green.
# Mergify's job here: batch Dependabot version-bump PRs so we don't
# burn N CI runs and N npm-publish triggers for what's effectively
# one weekly maintenance window.

queue_rules:
  - name: dependencies
    # ``merge_method`` lives on the queue rule (Mergify v2).
    merge_method: squash
    batch_size: 5
    batch_max_wait_time: 30 m
    merge_conditions:
      # Mirrors the required check from .github/workflows/ci.yml.
      # Update both together if the workflow's job name changes.
      - check-success=Typecheck, Test, Build

pull_request_rules:
  - name: batch-merge Dependabot PRs
    conditions:
      - or:
          - author=dependabot[bot]
          - author=dependabot
      - base=main
      - -draft
      - -conflict
      - label=dependencies
    actions:
      queue:
        name: dependencies
